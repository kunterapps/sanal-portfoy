# Cloudflare Worker for the price API (used by the Cloudflare Pages build).
# Deploy: npm run worker:deploy, or automatically via .github/workflows/deploy-worker.yml
name = "sanal-portfoy-fiyat"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to call the API (comma-separated)
ALLOWED_ORIGINS = "https://sanal-portfoy.pages.dev,http://localhost:3000"
